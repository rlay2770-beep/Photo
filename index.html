<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Myanmar Cartoon Creator (No API Key Required)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-sky-500/30">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <span class="font-bold text-lg sm:text-xl bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">
                        AI Cartoon Studio (Free)
                    </span>
                </div>
                
                <div class="flex items-center gap-2 bg-emerald-950/80 border border-emerald-800/80 px-3 py-1 rounded-full text-xs text-emerald-400">
                    <i class="fa-solid fa-circle-check"></i> Free Mode (No API Key Needed)
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Input Form & Settings -->
        <div class="lg:col-span-5 space-y-6">
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
                <h2 class="text-xl font-bold text-sky-400 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib"></i> ဇာတ်လမ်း ဖန်တီးပါ
                </h2>
                
                <!-- Prompt Input -->
                <div class="space-y-2 mb-4">
                    <label for="prompt" class="block text-sm font-medium text-slate-300">
                        စိတ်ကူးထဲရှိသော ဇာတ်လမ်း အကြောင်းအရာ ရိုက်ပါ:
                    </label>
                    <textarea id="prompt" rows="4" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition text-sm sm:text-base"
                        placeholder="ဥပမာ- ပုဂံမြို့ဟောင်းတွင် နေထိုင်သော ရွှေရောင်နဂါးလေးနှင့် သူငယ်ချင်း ဝက်ဝံကလေးတို့၏ စွန့်စားခန်း..."></textarea>
                </div>

                <!-- Video Settings -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ကာတွန်း စတိုင်လ်</label>
                        <select id="style" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs sm:text-sm text-slate-200 focus:outline-none">
                            <option value="3d Pixar style cartoon, vibrant colors">3D Pixar Style</option>
                            <option value="Studio Ghibli 2d anime storybook cartoon">2D Ghibli Anime</option>
                            <option value="cute 2D children comic book illustration">Cute Storybook</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">အခန်း အရေအတွက်</label>
                        <select id="scene-count" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs sm:text-sm text-slate-200 focus:outline-none">
                            <option value="3">၃ အခန်း</option>
                            <option value="4" selected>၄ အခန်း</option>
                        </select>
                    </div>
                </div>

                <!-- Action Button -->
                <button id="generate-btn" onclick="generateCartoonStory()" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-sky-500/25 flex items-center justify-center gap-2 transition active:scale-95">
                    <i class="fa-solid fa-clapperboard"></i> 🚀 ဇာတ်လမ်းနှင့် ပုံများ ဖန်တီးမည်
                </button>
            </div>

            <!-- Story Workflow Steps Tracker -->
            <div id="status-tracker" class="bg-slate-800/40 border border-slate-700/40 rounded-2xl p-6 hidden">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">လုပ်ဆောင်မှု အခြေအနေ</h3>
                <div class="space-y-3 text-sm">
                    <div id="status-text" class="flex items-center gap-3 text-sky-400 font-bold">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <span>AI မှ ဇာတ်ညွှန်းနှင့် ကာတွန်းပုံများ ဖန်တီးပေးနေပါသည်...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Output Scene Display Area -->
        <div class="lg:col-span-7 space-y-6">
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-sm min-h-[450px]">
                <h2 class="text-xl font-bold text-sky-400 mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-film"></i> Cartoon Storyboards</span>
                    <span id="scene-badge" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-normal">0 Scenes</span>
                </h2>

                <div id="scenes-container" class="space-y-6">
                    <!-- Default Placeholder -->
                    <div id="placeholder-text" class="text-center py-16 text-slate-500 border border-dashed border-slate-700 rounded-xl">
                        <i class="fa-solid fa-clapperboard text-4xl mb-3 text-slate-600"></i>
                        <p>ဇာတ်လမ်း ရိုက်ထည့်ပြီး ခလုတ်နှိပ်ပါက AI ကာတွန်းပုံများနှင့် မြန်မာအသံ ဖတ်ပြစနစ် ပေါ်လာပါမည်။</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic (Free Mode) -->
    <script>
        async function generateCartoonStory() {
            const prompt = document.getElementById('prompt').value.trim();
            if(!prompt) {
                alert('ကျေးဇူးပြု၍ ဇာတ်လမ်း အကြောင်းအရာ ရိုက်ထည့်ပါ!');
                return;
            }

            const artStyle = document.getElementById('style').value;
            const sceneCount = parseInt(document.getElementById('scene-count').value);

            // UI Loading Updates
            document.getElementById('status-tracker').classList.remove('hidden');
            document.getElementById('generate-btn').disabled = true;
            document.getElementById('generate-btn').classList.add('opacity-50');

            // Generate Smart Scenes based on user input
            const scenes = [];
            const baseEnglishPrompts = [
                `First scene of ${prompt}, cute characters introducing, ${artStyle}, high detail, 8k render`,
                `Second scene of ${prompt}, unexpected adventure begins, ${artStyle}, cinematic lighting`,
                `Climax scene of ${prompt}, magical action scene, ${artStyle}, colorful masterpiece`,
                `Happy ending scene of ${prompt}, characters celebrating together, ${artStyle}, warm atmosphere`
            ];

            const myanmarTemplates = [
                `အခန်း (၁) - ${prompt} ရဲ့ စိတ်လှုပ်ရှားဖွယ် ဇာတ်လမ်းလေး စတင်ပါပြီ။`,
                `အခန်း (၂) - ထို့နောက် မထင်မှတ်ထားသော စွန့်စားခန်းများနှင့် ရင်ဆိုင်ခဲ့ရပါတယ်။`,
                `အခန်း (၃) - သူတို့အားလုံး စိန်ခေါ်မှုတွေကို ရဲရဲဝံ့ဝံ့ ကျော်ဖြတ်နိုင်ခဲ့ကြပါတယ်။`,
                `အခန်း (၄) - နောက်ဆုံးမှာတော့ ပျော်ရွှင်စရာ ကောင်းမွန်တဲ့ နိဂုံးလေးနဲ့ ပြီးဆုံးသွားခဲ့ပါတယ်။`
            ];

            for(let i = 0; i < sceneCount; i++) {
                const encodedPrompt = encodeURIComponent(baseEnglishPrompts[i % baseEnglishPrompts.length]);
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=450&seed=${Math.floor(Math.random() * 10000)}&nologo=true`;
                
                scenes.push({
                    scene_number: i + 1,
                    myanmar_script: myanmarTemplates[i % myanmarTemplates.length],
                    image_url: imageUrl
                });
            }

            renderScenes(scenes);

            document.getElementById('status-tracker').classList.add('hidden');
            document.getElementById('generate-btn').disabled = false;
            document.getElementById('generate-btn').classList.remove('opacity-50');
        }

        function renderScenes(scenes) {
            const container = document.getElementById('scenes-container');
            document.getElementById('scene-badge').innerText = `${scenes.length} Scenes`;
            container.innerHTML = '';

            scenes.forEach((scene) => {
                const sceneHtml = `
                    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl p-4 space-y-3 shadow-lg">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <span class="text-xs font-bold text-sky-400 bg-sky-950/80 border border-sky-800 px-2.5 py-1 rounded-md">
                                Scene ${scene.scene_number}
                            </span>
                            <button onclick="speakMyanmar('${escapeQuotes(scene.myanmar_script)}')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-volume-high"></i> မြန်မာလို ဖတ်ပြပါ
                            </button>
                        </div>
                        
                        <div class="relative aspect-video w-full rounded-xl overflow-hidden border border-slate-800 bg-slate-950">
                            <img src="${scene.image_url}" alt="AI Scene Image" class="w-full h-full object-cover" loading="lazy" />
                        </div>

                        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50">
                            <label class="text-xs text-sky-400 block mb-1 font-bold">🇲🇲 မြန်မာ ဇာတ်ကြောင်း / စာတန်းထိုး:</label>
                            <p class="text-sm font-medium text-slate-100">
                                ${scene.myanmar_script}
                            </p>
                        </div>
                    </div>
                `;
                container.innerHTML += sceneHtml;
            });
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        function speakMyanmar(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'my-MM';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('သင့်ဖုန်း Browser က အသံဖတ်ပေးသည့် စနစ်ကို မထောက်ပံ့ပါခင်ဗျာ။');
            }
        }
    </script>

</body>
    </html>
