<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Space Runner Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #game-canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body class="bg-slate-900 text-white relative">

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay (Scores) -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none">
        <div class="bg-slate-800/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-xl">
            <span class="text-xs text-slate-400 block">SCORE</span>
            <span id="score-text" class="text-2xl font-bold text-sky-400">0</span>
        </div>
        <div class="bg-slate-800/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-xl text-right">
            <span class="text-xs text-slate-400 block">HIGH SCORE</span>
            <span id="highscore-text" class="text-2xl font-bold text-amber-400">0</span>
        </div>
    </div>

    <!-- Start / Game Over Screen -->
    <div id="game-menu" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-10">
        <h1 class="text-4xl sm:text-6xl font-extrabold bg-gradient-to-r from-sky-400 to-indigo-500 bg-clip-text text-transparent mb-2">
            3D SPACE RUNNER
        </h1>
        <p class="text-slate-400 mb-8 max-w-sm text-sm sm:text-base">
            အနီရောင် တားဆီးတုံးများကို ရှောင်ကင်း၍ ခရီးဆုံးအထိ အဝေးဆုံးသွားပါ။
        </p>

        <button id="start-btn" onclick="startGame()" class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold py-3 px-8 rounded-2xl shadow-lg shadow-sky-500/30 text-lg transition active:scale-95">
            🎮 PLAY GAME
        </button>
    </div>

    <!-- Mobile Touch Controls Overlay -->
    <div id="touch-controls" class="absolute inset-0 flex z-0 hidden">
        <div class="w-1/2 h-full" onclick="movePlayer(-1)"></div>
        <div class="w-1/2 h-full" onclick="movePlayer(1)"></div>
    </div>

    <!-- Game Engine JS -->
    <script>
        let scene, camera, renderer, player, obstacles = [], stars;
        let score = 0, highScore = 0, isPlaying = false, speed = 0.6;
        let targetX = 0;

        function init3D() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Player Ship (3D Pyramid Block)
            const playerGeo = new THREE.ConeGeometry(0.6, 1.2, 4);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.8 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.rotation.x = Math.PI / 2;
            player.position.set(0, 0.5, 0);
            scene.add(player);

            // Track/Floor Grid
            const gridHelper = new THREE.GridHelper(100, 40, 0x38bdf8, 0x1e293b);
            gridHelper.position.z = -40;
            scene.add(gridHelper);

            // Background Stars
            const starGeo = new THREE.BufferGeometry();
            const starCount = 500;
            const starCoords = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                starCoords[i] = (Math.random() - 0.5) * 200;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starCoords, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
            stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyDown);
        }

        function startGame() {
            // Reset state
            obstacles.forEach(o => scene.remove(o.mesh));
            obstacles = [];
            score = 0;
            speed = 0.6;
            targetX = 0;
            player.position.x = 0;
            isPlaying = true;

            document.getElementById('score-text').innerText = '0';
            document.getElementById('game-menu').classList.add('hidden');
            document.getElementById('touch-controls').classList.remove('hidden');

            animate();
        }

        function spawnObstacle() {
            const size = Math.random() * 0.8 + 0.8;
            const geo = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);
            
            const lanes = [-2.5, 0, 2.5];
            const posX = lanes[Math.floor(Math.random() * lanes.length)];
            mesh.position.set(posX, size/2, -60);
            
            scene.add(mesh);
            obstacles.push({ mesh, posX, size });
        }

        let frameCount = 0;
        function animate() {
            if(!isPlaying) return;
            requestAnimationFrame(animate);

            // Smooth movement
            player.position.x += (targetX - player.position.x) * 0.15;
            player.rotation.z = -(targetX - player.position.x) * 0.5;

            // Spawn obstacles
            frameCount++;
            if(frameCount % Math.max(20, Math.floor(40 - speed * 10)) === 0) {
                spawnObstacle();
            }

            // Move obstacles
            for(let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.mesh.position.z += speed;
                obs.mesh.rotation.x += 0.02;
                obs.mesh.rotation.y += 0.02;

                // Collision Check
                const distZ = Math.abs(obs.mesh.position.z - player.position.z);
                const distX = Math.abs(obs.mesh.position.x - player.position.x);

                if(distZ < 0.8 && distX < (obs.size / 2 + 0.4)) {
                    gameOver();
                    return;
                }

                // Remove passed obstacles & increase score
                if(obs.mesh.position.z > 5) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score-text').innerText = score;
                    if(score > highScore) {
                        highScore = score;
                        document.getElementById('highscore-text').innerText = highScore;
                    }
                    speed += 0.005; // Speed up over time
                }
            }

            renderer.render(scene, camera);
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('game-menu').classList.remove('hidden');
            document.getElementById('touch-controls').classList.add('hidden');
            document.querySelector('#game-menu h1').innerText = 'GAME OVER';
            document.getElementById('start-btn').innerText = '🔄 RESTART GAME';
        }

        function movePlayer(dir) {
            if(!isPlaying) return;
            if(dir === -1 && targetX > -2.5) targetX -= 2.5;
            if(dir === 1 && targetX < 2.5) targetX += 2.5;
        }

        function handleKeyDown(e) {
            if(e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1);
            if(e.key === 'ArrowRight' || e.key === 'd') movePlayer(1);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init3D;
    </script>
</body>
</html>
