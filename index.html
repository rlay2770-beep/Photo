<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D FPS Combat: Soldiers & Tanks</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        .crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            border: 2px solid rgba(56, 189, 248, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-white relative">

    <div id="canvas-container"></div>
    <div class="crosshair"></div>

    <!-- HUD Overlay -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
        <div class="flex gap-4">
            <div class="bg-slate-900/80 backdrop-blur border border-slate-800 px-4 py-2 rounded-xl">
                <span class="text-xs text-slate-400 block">STAGE</span>
                <span id="stage-text" class="text-xl font-bold text-amber-400">1</span>
            </div>
            <div class="bg-slate-900/80 backdrop-blur border border-slate-800 px-4 py-2 rounded-xl">
                <span class="text-xs text-slate-400 block">ENEMIES LEFT</span>
                <span id="enemies-text" class="text-xl font-bold text-rose-500">0</span>
            </div>
        </div>
        <div class="bg-slate-900/80 backdrop-blur border border-slate-800 px-4 py-2 rounded-xl text-right">
            <span class="text-xs text-slate-400 block">HEALTH</span>
            <span id="health-text" class="text-xl font-bold text-emerald-400">100 HP</span>
        </div>
    </div>

    <!-- Gun Overlay (FPS View) -->
    <div class="absolute bottom-0 right-1/3 pointer-events-none z-10 hidden sm:block">
        <div class="w-16 h-32 bg-slate-800 rounded-t-lg transform rotate-12 border-l-4 border-slate-600"></div>
    </div>

    <!-- Menu Screen -->
    <div id="menu-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
        <h1 class="text-4xl sm:text-6xl font-black bg-gradient-to-r from-rose-500 via-amber-400 to-sky-400 bg-clip-text text-transparent mb-2">
            3D COMBAT WARZONE
        </h1>
        <p class="text-slate-400 mb-6 max-w-md text-sm sm:text-base">
            ရန်သူ စစ်သည်များနှင့် တင့်ကားများကို ချေမှုန်းပါ။ အဆင့်မြင့် အခန်းများကို ဆက်လက် တိုက်ခိုက်ပါ။
        </p>
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl mb-6 text-xs text-slate-300 max-w-xs text-left">
            <p>🎮 <b>PC Controls:</b> WASD (Walk), Mouse (Look), Left Click (Shoot)</p>
            <p class="mt-1">📱 <b>Mobile:</b> Touch & Fire Buttons</p>
        </div>
        <button id="start-btn" onclick="startGame()" class="bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-bold py-3 px-8 rounded-2xl shadow-lg shadow-rose-600/30 text-lg transition active:scale-95">
            ⚔️ START BATTLE
        </button>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="absolute inset-0 z-10 hidden sm:hidden pointer-events-none">
        <button id="fire-btn" class="pointer-events-auto absolute bottom-8 right-8 w-20 h-20 bg-rose-600/80 rounded-full border-2 border-rose-400 text-white font-black active:scale-90 flex items-center justify-center">
            FIRE
        </button>
    </div>

    <script>
        let scene, camera, renderer, playerHealth = 100;
        let stage = 1, enemiesLeft = 0;
        let enemies = [], bullets = [], particles = [];
        let isPlaying = false;

        // Player Controls
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let yaw = 0, pitch = 0;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xfbbf24, 1.2);
            sun.position.set(20, 40, 20);
            scene.add(sun);

            // Battlefield Ground
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Grid helper for terrain texture
            const grid = new THREE.GridHelper(300, 60, 0x38bdf8, 0x334155);
            grid.position.y = 0.01;
            scene.add(grid);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', (e) => handleKey(e, true));
            document.addEventListener('keyup', (e) => handleKey(e, false));

            container.addEventListener('click', () => {
                if(isPlaying && document.pointerLockElement !== container) {
                    container.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === container && isPlaying) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
                }
            });

            document.addEventListener('mousedown', (e) => {
                if(isPlaying && e.button === 0) shoot();
            });

            document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if(isPlaying) shoot();
            });
        }

        function handleKey(e, isDown) {
            if(e.code === 'KeyW') moveForward = isDown;
            if(e.code === 'KeyS') moveBackward = isDown;
            if(e.code === 'KeyA') moveLeft = isDown;
            if(e.code === 'KeyD') moveRight = isDown;
        }

        function spawnEnemySoldier(x, z) {
            const group = new THREE.Group();
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.7;
            group.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.3);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xfca5a5 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.6;
            group.add(head);

            group.position.set(x, 0, z);
            scene.add(group);
            return { mesh: group, type: 'soldier', hp: 30, speed: 0.05 };
        }

        function spawnEnemyTank(x, z) {
            const group = new THREE.Group();
            // Base Body
            const baseGeo = new THREE.BoxGeometry(3, 1.2, 4);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.6;
            group.add(base);

            // Turret
            const turretGeo = new THREE.BoxGeometry(2, 0.8, 2);
            const turretMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            const turret = new THREE.Mesh(turretGeo, turretMat);
            turret.position.y = 1.6;
            group.add(turret);

            // Cannon Barrel
            const barrelGeo = new THREE.CylinderGeometry(0.15, 0.15, 2.5);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 1.6, 2);
            group.add(barrel);

            group.position.set(x, 0, z);
            scene.add(group);
            return { mesh: group, type: 'tank', hp: 120, speed: 0.02 };
        }

        function startStage() {
            // Clear existing
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];

            const soldierCount = stage * 3;
            const tankCount = Math.floor(stage / 2);
            enemiesLeft = soldierCount + tankCount;

            document.getElementById('stage-text').innerText = stage;
            document.getElementById('enemies-text').innerText = enemiesLeft;

            // Spawn Soldiers
            for(let i=0; i<soldierCount; i++) {
                let x = (Math.random() - 0.5) * 80;
                let z = -20 - Math.random() * 60;
                enemies.push(spawnEnemySoldier(x, z));
            }

            // Spawn Tanks
            for(let i=0; i<tankCount; i++) {
                let x = (Math.random() - 0.5) * 80;
                let z = -30 - Math.random() * 60;
                enemies.push(spawnEnemyTank(x, z));
            }
        }

        function startGame() {
            isPlaying = true;
            playerHealth = 100;
            stage = 1;
            camera.position.set(0, 1.6, 0);
            yaw = 0; pitch = 0;

            document.getElementById('health-text').innerText = playerHealth + ' HP';
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('mobile-controls').classList.remove('hidden');

            startStage();
            animate();
        }

        function shoot() {
            // Bullet projectile
            const bulletGeo = new THREE.SphereGeometry(0.15);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(camera.position);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            scene.add(bullet);
            bullets.push({ mesh: bullet, dir: dir, life: 100 });
        }

        function createExplosion(pos) {
            for(let i=0; i<15; i++) {
                const pGeo = new THREE.SphereGeometry(0.1 + Math.random()*0.2);
                const pMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xf97316 : 0xef4444 });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                scene.add(p);
                particles.push({
                    mesh: p,
                    vel: new THREE.Vector3((Math.random()-0.5)*0.3, Math.random()*0.3, (Math.random()-0.5)*0.3),
                    life: 20
                });
            }
        }

        function animate() {
            if(!isPlaying) return;
            requestAnimationFrame(animate);

            // Camera Rotation
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Player Movement
            const speed = 0.15;
            const dir = new THREE.Vector3();
            if (moveForward) dir.z -= 1;
            if (moveBackward) dir.z += 1;
            if (moveLeft) dir.x -= 1;
            if (moveRight) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            camera.position.addScaledVector(dir, speed);

            // Update Bullets
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, 1.2);
                b.life--;

                // Hit Detection with Enemies
                for(let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    const dist = b.mesh.position.distanceTo(e.mesh.position);
                    const hitDist = e.type === 'tank' ? 2.2 : 1.0;

                    if(dist < hitDist) {
                        e.hp -= 30;
                        createExplosion(b.mesh.position);
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);

                        if(e.hp <= 0) {
                            createExplosion(e.mesh.position);
                            scene.remove(e.mesh);
                            enemies.splice(j, 1);
                            enemiesLeft--;
                            document.getElementById('enemies-text').innerText = enemiesLeft;

                            // Stage Clear Check
                            if(enemiesLeft <= 0) {
                                stage++;
                                startStage();
                            }
                        }
                        break;
                    }
                }

                if(b && b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // Update Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.mesh.position.add(p.vel);
                p.life--;
                if(p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            // Update Enemy Movement & Attack
            enemies.forEach(e => {
                const toPlayer = new THREE.Vector3().subVectors(camera.position, e.mesh.position);
                toPlayer.y = 0;
                const dist = toPlayer.length();

                if(dist > 2) {
                    toPlayer.normalize();
                    e.mesh.position.addScaledVector(toPlayer, e.speed);
                    e.mesh.lookAt(camera.position.x, e.mesh.position.y, camera.position.z);
                } else {
                    // Attack Player
                    playerHealth -= e.type === 'tank' ? 0.3 : 0.1;
                    document.getElementById('health-text').innerText = Math.max(0, Math.floor(playerHealth)) + ' HP';
                    if(playerHealth <= 0) {
                        gameOver();
                    }
                }
            });

            renderer.render(scene, camera);
        }

        function gameOver() {
            isPlaying = false;
            document.exitPointerLock();
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('mobile-controls').classList.add('hidden');
            document.querySelector('#menu-screen h1').innerText = 'MISSION FAILED';
            document.getElementById('start-btn').innerText = '🔄 RETRY BATTLE';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
                </html>
