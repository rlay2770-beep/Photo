<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom AI Chatbot</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
        h2 { text-align: center; color: #00ffcc; margin-top: 0; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column; background-color: #1e1e1e; }
        .message { margin: 8px 0; padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        .user { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #2d2d2d; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #00ffcc; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 16px; outline: none; }
        button { padding: 14px 24px; background: #00ffcc; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        button:hover { background: #00cca3; }
    </style>
</head>
<body>

    <h2>My Custom AI</h2>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="တစ်ခုခု မေးမြန်းပါ..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">မေးမည်</button>
    </div>

    <script>
        const API_KEY = "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"; 

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chat-box");
            const text = input.value.trim();

            if (!text) return;

            // User Message
            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Loading state
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${loadingId}">စဉ်းစားနေသည်...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="message bot">${aiReply.replace(/\n/g, '<br>')}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message bot" style="color:red;">Error: AI စာပြန်ရန် မအောင်မြင်ပါ။</div>`;
                }
                
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot" style="color:red;">Error: ချိတ်ဆက်မှု မအောင်မြင်ပါ။ API Key ကို စစ်ဆေးပါ။</div>`;
            }
        }
    </script>
</body>
</html>
