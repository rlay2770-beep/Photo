<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Custom AI Chatbot</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        /* ဖုန်းမျက်နှာပြင် ကီးဘုတ်ပွင့်ချိန် အဆင်ပြေစေရန် Viewport ထိန်းညှိခြင်း */
        html, body { 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            color: #fff; 
            height: 100vh; 
            height: 100dvh; /* Dynamic Viewport for Mobile */
            overflow: hidden; 
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Sidebar Styling */
        .sidebar { 
            width: 260px; 
            background-color: #1e1e1e; 
            border-right: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            padding: 10px; 
            flex-shrink: 0;
        }
        .new-chat-btn { 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 10px; 
            font-size: 14px; 
        }
        .history-list { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        .history-item { 
            padding: 10px; 
            border-radius: 6px; 
            background: #2a2a2a; 
            cursor: pointer; 
            font-size: 13px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .history-item span {
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            flex: 1;
        }
        .history-item.active { background: #007bff; color: white; }
        .delete-btn { color: #ff4d4d; border: none; background: none; cursor: pointer; font-size: 14px; padding: 0 5px; }

        /* Main Chat Area - Layout Corrected */
        .main-chat { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100%;
            min-width: 0;
        }
        .header { 
            padding: 12px 15px; 
            border-bottom: 1px solid #333; 
            background: #181818; 
            text-align: center; 
            flex-shrink: 0;
        }
        .header h2 { margin: 0; color: #00ffcc; font-size: 16px; }

        /* Chat Box Scrollable Area */
        #chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            -webkit-overflow-scrolling: touch;
        }
        
        /* Messages Styling */
        .message { 
            padding: 10px 14px; 
            border-radius: 12px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: 14px; 
            word-wrap: break-word; 
        }
        .user { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #2d2d2d; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #00ffcc; }

        /* Fixed Input Area for Mobile Phones */
        .input-area { 
            padding: 10px 12px; 
            display: flex; 
            gap: 8px; 
            background: #181818; 
            border-top: 1px solid #333; 
            flex-shrink: 0;
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #2a2a2a; 
            color: white; 
            font-size: 15px; 
            outline: none; 
        }
        button.send-btn { 
            padding: 12px 18px; 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            flex-shrink: 0;
        }

        /* Responsive Mobile adjustments */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { 
                width: 100%; 
                max-height: 120px; 
                border-right: none; 
                border-bottom: 1px solid #333; 
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ဘေးဘက် Sidebar -->
        <div class="sidebar">
            <button class="new-chat-btn" onclick="createNewChat()">+ စကားဝိုင်းအသစ် (New Chat)</button>
            <div class="history-list" id="historyList"></div>
        </div>

        <!-- ပင်မ Chat ဧရိယာ -->
        <div class="main-chat">
            <div class="header">
                <h2>My Custom AI</h2>
            </div>

            <div id="chat-box"></div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="တစ်ခုခု မေးမြန်းပါ..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">မေးမည်</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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"; 
        const systemPrompt = { 
            role: "system", 
            content: "You are a helpful and polite AI assistant. Always respond in natural, fluent, and polite Burmese (Myanmar language)." 
        };

        let allSessions = JSON.parse(localStorage.getItem("ai_all_sessions")) || {};
        let currentSessionId = localStorage.getItem("ai_current_session_id") || null;

        window.onload = function() {
            if (!currentSessionId || !allSessions[currentSessionId]) {
                createNewChat();
            } else {
                renderHistoryList();
                loadSession(currentSessionId);
            }
        };

        function createNewChat() {
            const sessionId = "chat_" + Date.now();
            allSessions[sessionId] = {
                title: "စကားဝိုင်းအသစ်",
                messages: [systemPrompt]
            };
            currentSessionId = sessionId;
            saveState();
            renderHistoryList();
            loadSession(currentSessionId);
        }

        function saveState() {
            localStorage.setItem("ai_all_sessions", JSON.stringify(allSessions));
            localStorage.setItem("ai_current_session_id", currentSessionId);
        }

        function renderHistoryList() {
            const listEl = document.getElementById("historyList");
            listEl.innerHTML = "";

            Object.keys(allSessions).reverse().forEach(id => {
                const session = allSessions[id];
                const item = document.createElement("div");
                item.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
                
                item.innerHTML = `
                    <span onclick="switchSession('${id}')">${session.title}</span>
                    <button class="delete-btn" onclick="deleteSession(event, '${id}')">✕</button>
                `;
                listEl.appendChild(item);
            });
        }

        function switchSession(id) {
            currentSessionId = id;
            saveState();
            renderHistoryList();
            loadSession(id);
        }

        function loadSession(id) {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";
            const session = allSessions[id];

            if (!session) return;

            session.messages.forEach(msg => {
                if (msg.role === "user") {
                    chatBox.innerHTML += `<div class="message user">${msg.content}</div>`;
                } else if (msg.role === "assistant") {
                    chatBox.innerHTML += `<div class="message bot">${msg.content.replace(/\n/g, '<br>')}</div>`;
                }
            });
            scrollToBottom();
        }

        function deleteSession(e, id) {
            e.stopPropagation();
            delete allSessions[id];
            const keys = Object.keys(allSessions);
            if (keys.length > 0) {
                currentSessionId = keys[keys.length - 1];
            } else {
                createNewChat();
                return;
            }
            saveState();
            renderHistoryList();
            loadSession(currentSessionId);
        }

        function scrollToBottom() {
            const chatBox = document.getElementById("chat-box");
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 100);
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chat-box");
            const text = input.value.trim();

            if (!text || !currentSessionId) return;

            const session = allSessions[currentSessionId];

            if (session.messages.length === 1) {
                session.title = text.length > 15 ? text.substring(0, 15) + "..." : text;
                renderHistoryList();
            }

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = "";
            scrollToBottom();

            session.messages.push({ role: "user", content: text });

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${loadingId}">စဉ်းစားနေသည်...</div>`;
            scrollToBottom();

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: session.messages
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="message bot">${aiReply.replace(/\n/g, '<br>')}</div>`;
                    session.messages.push({ role: "assistant", content: aiReply });
                    saveState();
                } else {
                    chatBox.innerHTML += `<div class="message bot" style="color:red;">Error: AI စာပြန်ရန် မအောင်မြင်ပါ။</div>`;
                }
                
                scrollToBottom();
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot" style="color:red;">Error: ချိတ်ဆက်မှု မအောင်မြင်ပါ။</div>`;
                scrollToBottom();
            }
        }
    </script>
</body>
    </html>
