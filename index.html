<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom AI Chatbot</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h2 { color: #00ffcc; margin: 0; font-size: 20px; }
        .clear-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .clear-btn:hover { background: #cc0000; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column; background-color: #1e1e1e; }
        .message { margin: 8px 0; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
        .user { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #2d2d2d; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #00ffcc; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 16px; outline: none; }
        button.send-btn { padding: 14px 20px; background: #00ffcc; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button.send-btn:hover { background: #00cca3; }
    </style>
</head>
<body>

    <div class="header">
        <h2>My Custom AI</h2>
        <button class="clear-btn" onclick="clearHistory()">Clear Chat</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="တစ်ခုခု မေးမြန်းပါ..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">မေးမည်</button>
    </div>

    <script>
        const API_KEY = "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"; 

        // AI ရဲ့ စရိုက် သတ်မှတ်ချက်
        const systemPrompt = { 
            role: "system", 
            content: "You are a helpful and polite AI assistant. Always respond in natural, fluent, and polite Burmese (Myanmar language). Remember past context from conversation." 
        };

        // LocalStorage မှ History ပြန်ယူခြင်း (မရှိရင် အသစ်စမည်)
        let conversationHistory = JSON.parse(localStorage.getItem("ai_chat_history")) || [systemPrompt];

        // Page စတင်ချိန်တွင် သိမ်းထားသော စကားဝိုင်းများကို မျက်နှာပြင်ပေါ် ပြန်ထုတ်ပြခြင်း
        window.onload = function() {
            const chatBox = document.getElementById("chat-box");
            conversationHistory.forEach(msg => {
                if (msg.role === "user") {
                    chatBox.innerHTML += `<div class="message user">${msg.content}</div>`;
                } else if (msg.role === "assistant") {
                    chatBox.innerHTML += `<div class="message bot">${msg.content.replace(/\n/g, '<br>')}</div>`;
                }
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chat-box");
            const text = input.value.trim();

            if (!text) return;

            // UI ပေါ်တွင် User Message ပြခြင်း
            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Context/Memory ထဲသို့ User စကားထည့်ခြင်း
            conversationHistory.push({ role: "user", content: text });

            // Loading state
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${loadingId}">စဉ်းစားနေသည်...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: conversationHistory // စကားဝိုင်း အစအဆုံး အကျဉ်းချုပ်ကို AI ထံ ပို့ပေးခြင်း
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    
                    // UI ပေါ်တွင် AI Message ပြခြင်း
                    chatBox.innerHTML += `<div class="message bot">${aiReply.replace(/\n/g, '<br>')}</div>`;
                    
                    // Context/Memory ထဲသို့ AI စကားထည့်ခြင်း
                    conversationHistory.push({ role: "assistant", content: aiReply });

                    // LocalStorage တွင် History အဖြစ် သိမ်းဆည်းခြင်း
                    localStorage.setItem("ai_chat_history", JSON.stringify(conversationHistory));
                } else {
                    chatBox.innerHTML += `<div class="message bot" style="color:red;">Error: AI စာပြန်ရန် မအောင်မြင်ပါ။</div>`;
                }
                
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot" style="color:red;">Error: ချိတ်ဆက်မှု မအောင်မြင်ပါ။</div>`;
            }
        }

        // History အားလုံးကို ဖျက်ပစ်သည့် Function
        function clearHistory() {
            if (confirm("စကားဝိုင်း မှတ်တမ်းအားလုံးကို ဖျက်ရန် သေချာပါသလား?")) {
                localStorage.removeItem("ai_chat_history");
                conversationHistory = [systemPrompt];
                document.getElementById("chat-box").innerHTML = "";
            }
        }
    </script>
</body>
</html>
