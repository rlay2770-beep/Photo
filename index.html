<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            resize: none;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-primary {
            background: #0284c7;
            color: white;
        }
        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }
        .result-box {
            text-align: center;
        }
        img {
            max-width: 100%;
            border-radius: 12px;
            display: none;
            margin-top: 15px;
            border: 2px solid #38bdf8;
        }
        .loading {
            display: none;
            color: #38bdf8;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ AI Image Studio</h2>
    
    <label for="prompt">ဖန်တီးချင်သော ပုံအကြောင်းအရာ ရိုက်ပါ:</label>
    <textarea id="prompt" placeholder="eg. A glowing cyberpunk neon dragon in space..."></textarea>

    <div class="btn-group">
        <button class="btn-secondary" onclick="generateIdea()">💡 Idea ယူမည်</button>
        <button class="btn-primary" onclick="generateImage()">🚀 ပုံထုတ်မည်</button>
    </div>

    <div class="result-box">
        <div id="loading" class="loading">⏳ AI မှ ပုံဆွဲပေးနေပါသည်... ခဏစောင့်ပါ။</div>
        <img id="output-image" src="" alt="AI Generated Image">
    </div>
</div>

<script>
    const sampleIdeas = [
        "A cute baby panda wearing a space helmet on the moon, 8k render",
        "A mystical forest with glowing mushrooms and a waterfall, highly detailed",
        "A futuristic sports car driving through a rainy neon city at night",
        "A traditional Myanmar temple floating in the clouds, golden hour"
    ];

    function generateIdea() {
        const randomIndex = Math.floor(Math.random() * sampleIdeas.length);
        document.getElementById('prompt').value = sampleIdeas[randomIndex];
    }

    function generateImage() {
        const promptText = document.getElementById('prompt').value;
        const imgElement = document.getElementById('output-image');
        const loadingElement = document.getElementById('loading');

        if (!promptText.trim()) {
            alert('ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ!');
            return;
        }

        loadingElement.style.display = 'block';
        imgElement.style.display = 'none';

        const encodedPrompt = encodeURIComponent(promptText);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&seed=${Math.floor(Math.random() * 1000)}`;

        imgElement.src = imageUrl;
        imgElement.onload = function() {
            loadingElement.style.display = 'none';
            imgElement.style.display = 'block';
        };
    }
</script>

</body>
  </html>
