<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar AI Story & Animation Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Padauk', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            resize: none;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-full {
            grid-column: span 2;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #0284c7;
            color: white;
        }
        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .story-card {
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #334155;
            display: none;
        }
        .myanmar-sub {
            font-size: 16px;
            color: #f1f5f9;
            margin-bottom: 10px;
            line-height: 1.6;
            background: #1e293b;
            padding: 10px;
            border-left: 4px solid #38bdf8;
            border-radius: 4px;
        }
        img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            border: 2px solid #38bdf8;
        }
        .loading {
            display: none;
            color: #38bdf8;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 AI Story & Animation Studio</h2>
    
    <label for="prompt">ဇာတ်လမ်း အိုင်ဒီယာ ရိုက်ပါ (သို့မဟုတ် Idea ယူပါ):</label>
    <textarea id="prompt" placeholder="ဥပမာ- ပုဂံမြို့ဟောင်းက ရွှေရောင်နဂါးလေးအကြောင်း..."></textarea>

    <div class="btn-group">
        <button class="btn-secondary" onclick="generateIdea()">💡 Idea ယူမည်</button>
        <button class="btn-danger" onclick="clearText()">🧹 Clear</button>
        <button class="btn-primary btn-full" onclick="createStory()">🚀 ဇာတ်လမ်းနှင့် ပုံထုတ်မည်</button>
    </div>

    <div id="loading" class="loading">⏳ AI မှ မြန်မာဇာတ်လမ်းနှင့် ပုံများ ဖန်တီးနေပါသည်...</div>

    <div id="story-display" class="story-card">
        <div id="myanmar-text" class="myanmar-sub"></div>
        <img id="output-image" src="" alt="AI Scene Image">
        <button class="btn-success btn-full" style="margin-top:10px;" onclick="speakMyanmar()">🔊 မြန်မာလို အသံဖတ်ပြပါ</button>
    </div>
</div>

<script>
    const sampleIdeas = [
        {
            my: "ဟိုးရှေးရှေးတုန်းက ပုဂံပြည်ကြီးမှာ ကောင်းကင်ထက် ပျံသန်းနိုင်တဲ့ ရွှေရောင်နဂါးလေးတစ်ကောင် ရှိခဲ့ပါတယ်။",
            en: "A glowing golden dragon flying gracefully over ancient Bagan temples in Myanmar, magical lighting, 8k render"
        },
        {
            my: "အာကာသထဲမှာ ဝတ်စုံဝတ်ပြီး လကမ္ဘာပေါ်မှာ လမ်းလျှောက်နေတဲ့ ချစ်စရာ ဝက်ဝံကလေး။",
            en: "A cute panda bear wearing a detailed space suit walking on the moon, cosmic stars background, cinematic photo"
        },
        {
            my: "မိုးရွာနေတဲ့ ညဘက် နီယွန်မီးရောင်တွေလင်းနေတဲ့ အနာဂတ်မြို့တော်ကြီးထဲက ပြိုင်ကားတစ်စီး။",
            en: "A futuristic sports car driving through a rainy neon city at night, wet street reflections, highly detailed"
        }
    ];

    let currentMyanmarText = "";
    let currentImagePrompt = "";

    function generateIdea() {
        const randomIndex = Math.floor(Math.random() * sampleIdeas.length);
        const selected = sampleIdeas[randomIndex];
        document.getElementById('prompt').value = selected.my;
        currentImagePrompt = selected.en;
    }

    function clearText() {
        document.getElementById('prompt').value = '';
        document.getElementById('story-display').style.display = 'none';
    }

    function createStory() {
        const inputText = document.getElementById('prompt').value;
        const loadingElement = document.getElementById('loading');
        const storyDisplay = document.getElementById('story-display');
        const myanmarTextElem = document.getElementById('myanmar-text');
        const imgElement = document.getElementById('output-image');

        if (!inputText.trim()) {
            alert('ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ!');
            return;
        }

        loadingElement.style.display = 'block';
        storyDisplay.style.display = 'none';

        currentMyanmarText = inputText;
        myanmarTextElem.innerText = "📝 မြန်မာစာတန်းထိုး: " + currentMyanmarText;

        // Image Prompt အင်္ဂလိပ်စာမရှိရင် Input စာသားအတိုင်း ပုံဆွဲရန်
        const promptForAI = currentImagePrompt || inputText;
        const encodedPrompt = encodeURIComponent(promptForAI);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&seed=${Math.floor(Math.random() * 1000)}`;

        imgElement.src = imageUrl;
        imgElement.onload = function() {
            loadingElement.style.display = 'none';
            storyDisplay.style.display = 'block';
        };
    }

    // မြန်မာလို အသံထွက်ဖတ်ပေးသည့် စနစ် (Web Speech API)
    function speakMyanmar() {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(currentMyanmarText);
            utterance.lang = 'my-MM'; // Myanmar Language Code
            utterance.rate = 0.9; // အသံနှုန်း လျှော့ထားသည်
            window.speechSynthesis.speak(utterance);
        } else {
            alert('သင့်ဖုန်း Browser က အသံဖတ်ပေးသည့် စနစ်ကို မထောက်ပံ့ပါခင်ဗျာ။');
        }
    }
</script>

</body>
</html>
